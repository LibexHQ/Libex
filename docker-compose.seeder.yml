# Seeder stack. Deploy after docker-compose.yml.
name: libex-seeder

services:
  libex-seeder:
    image: ghcr.io/libexhq/libex:latest
    container_name: libex-seeder
    # the forever loop, not --once.
    command: ["python", "-m", "scripts.seed"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-libex}:${DB_PASSWORD:?set DB_PASSWORD in this stack's environment -- the same value the API stack uses}@libex-postgres:5432/${DB_NAME:-libex}
      # required: this stack's own VPN exit.
      - AUDIBLE_PROXY_URL=${SEEDER_PROXY_URL:?set SEEDER_PROXY_URL to this stack's VPN proxy, e.g. http://libex-seeder-vpn:8888 -- its hostname must contain "seeder"}
      # one cache table: match the API stack.
      - CACHE_TTL=${CACHE_TTL:-86400}
      - SEEDER_INTERVAL_HOURS=${SEEDER_INTERVAL_HOURS:-24}
      - SEEDER_REQUEST_DELAY=${SEEDER_REQUEST_DELAY:-1.0}
      - SEEDER_REGIONS=${SEEDER_REGIONS:-us}
      - SEEDER_NEW_RELEASES_INTERVAL_HOURS=${SEEDER_NEW_RELEASES_INTERVAL_HOURS:-24}
      - SEEDER_REFRESH_ENABLED=${SEEDER_REFRESH_ENABLED:-false}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AXIOM_TOKEN=${AXIOM_TOKEN:-}
      - AXIOM_DATASET=${AXIOM_DATASET:-libex}
    volumes:
      - ${LOGS_PATH:-./logs}:/app/logs
    # above the 300s write drain.
    stop_grace_period: 310s
    mem_limit: ${SEEDER_MEM_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - libex-seeder-egress
      - libex-db

  # example exit; replace or remove.
  libex-seeder-vpn:
    image: qmcgaw/gluetun:v3
    container_name: libex-seeder-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${SEEDER_WG_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${SEEDER_WG_ADDRESS:-}
      - WIREGUARD_ENDPOINT_IP=${SEEDER_WG_ENDPOINT_IP:-}
      - WIREGUARD_ENDPOINT_PORT=${SEEDER_WG_ENDPOINT_PORT:-}
      - WIREGUARD_PUBLIC_KEY=${SEEDER_WG_PUBLIC_KEY:-}
      - WIREGUARD_PRESHARED_KEY=${SEEDER_WG_PRESHARED_KEY:-}
      - HTTPPROXY=on
      - HTTPPROXY_LOG=on
    # egress only. never publish 8888.
    networks:
      - libex-seeder-egress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # created by docker-compose.yml.
  libex-db:
    name: libex-db
    external: true
  # pinned: a separate VPN stack joins it by name.
  libex-seeder-egress:
    name: libex-seeder-egress
    driver: bridge
