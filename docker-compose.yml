services:
  libex:
    image: ghcr.io/libexhq/libex:latest
    container_name: libex
    restart: unless-stopped
    # the published host port only -- inside the container the app always
    # listens on 3333 (Dockerfile CMD --port 3333) and reads no PORT variable.
    ports:
      - "${PORT:-3333}:3333"
    # an allowlist, not a passthrough: a name absent here is not readable in the
    # container and the app silently takes its compiled-in default, so adding a
    # setting to app/core/config.py is only half of wiring it up.
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-libex}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-libex}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-86400}
      - DEFAULT_REGION=${DEFAULT_REGION:-us}
      # empty is a working deployment: Audible requests then leave by the same
      # IP the public API answers on.
      - AUDIBLE_PROXY_URL=${AUDIBLE_PROXY_URL:-}
      # a literal, deliberately not a knob -- every per-process budget was sized
      # against this number. the db pool is 10 + 10 per worker, so six workers
      # reach the 120 connections postgres below runs max_connections=200 for;
      # the Audible concurrency limits and persist_queue's backlog cap are per
      # worker too. moving it means redoing that arithmetic here, not in a stack.
      - WEB_CONCURRENCY=6
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # empty token means stdout only. the dataset default repeats config.py's
      # because an empty value here overrides it and logging.py needs both.
      - AXIOM_TOKEN=${AXIOM_TOKEN:-}
      - AXIOM_DATASET=${AXIOM_DATASET:-libex}
      # the PBKDF2 hash /internal/seed/narrators checks the bearer token
      # against, never the token. empty disables the endpoint. generate with
      # `python -m app.api.routes.internal.router`.
      - SEED_SECRET=${SEED_SECRET:-}
      # Deprecation/Sunset/Link headers, empty by default because they name
      # somebody else's hostname and dates. NEW_HOST, ANNOUNCED and SUNSET are
      # required together -- a partial set serves no notice at all.
      - MIGRATION_NOTICE_ENABLED=${MIGRATION_NOTICE_ENABLED:-false}
      - MIGRATION_NEW_HOST=${MIGRATION_NEW_HOST:-}
      - MIGRATION_ANNOUNCED=${MIGRATION_ANNOUNCED:-}
      - MIGRATION_SUNSET=${MIGRATION_SUNSET:-}
      - MIGRATION_INFO_URL=${MIGRATION_INFO_URL:-}
      # no SEEDER_* here: the seeder runs in its own stack, docker-compose.seeder.yml.
    # /app/logs is the only path the image expects to be writable.
    volumes:
      - ${LOGS_PATH:-./logs}:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 3333 is the container's port and never moves; PORT relocates the host
      # side only. unhealthy is a reported status, not an action -- Docker does
      # not restart on it, and restart: unless-stopped covers exit, not wedge.
      test: ["CMD", "curl", "-f", "http://${HEALTHCHECK_HOST:-localhost}:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # json-file's max-size defaults to -1, unlimited, so a container that runs
    # for months writes stdout to the host disk with nothing capping it. 10m x 5
    # holds this service to 50MB of rotated json. The driver is named rather
    # than inherited because these options are validated against whichever
    # driver the host daemon defaults to, and a host that has changed that
    # default would reject them.
    #
    # Not a second copy of LOG_RETENTION_DAYS above. That one bounds the app's
    # own /app/logs/libex.log, rotated daily by app/core/logging.py and kept for
    # that many days, where 0 means keep forever. This bounds the separate copy
    # Docker keeps of the same lines on their way to stdout. Two paths, two
    # mechanisms, and neither one truncates the other's file.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: libex-postgres
    restart: unless-stopped
    # six API workers hold 20 connections each at full stretch, and the image
    # default of 100 leaves only 97 for the libex role. every other container on
    # this image -- the seeder stack, refresh_corpus, backfill_chapters -- is
    # another 20 on top while it runs, and nothing enforces that budget.
    command: ["postgres", "-c", "max_connections=200"]
    # /dev/shm, where postgres puts every parallel query's dynamic shared memory
    # segment -- dynamic_shared_memory_type defaults to posix on Linux, which is
    # shm_open, which is /dev/shm. Docker's default for it is 64MB (`df -h
    # /dev/shm` in any container), and a parallel scan that outgrows that fails
    # the query with "could not resize shared memory segment: No space left on
    # device" rather than degrading to a serial plan. tmpfs allocates on use, so
    # this is a ceiling and not 1GB taken at start; the pages it does take are
    # still RAM, competing with the page cache that keeps the stats counts fast,
    # so raise it in response to a failure rather than pre-emptively.
    shm_size: ${DB_SHM_SIZE:-1gb}
    # loopback: the seeder stack reaches this container over libex-db, so the
    # host port is only for your own psql/DBeaver, directly or via an ssh tunnel.
    # DB_BIND=0.0.0.0 widens it, with only the postgres password in front.
    ports:
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-libex}
      POSTGRES_USER: ${DB_USER:-libex}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # libex-db carries the seeder stack's traffic; default must stay listed or
    # libex above loses its route here.
    networks:
      - default
      - libex-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-libex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # this image sets STOPSIGNAL SIGINT, so a stop is postgres's fast shutdown:
    # backends are killed off, then a shutdown checkpoint runs before exit.
    # Docker's default allows 10s for that, and a SIGKILL landing mid-checkpoint
    # buys crash recovery on the next start. A grace period is a maximum wait
    # and not a delay -- Docker stops waiting the moment the container exits --
    # so this is set generously on purpose rather than fitted to a checkpoint
    # time nobody has measured on this database.
    stop_grace_period: 120s
    # the same unlimited json-file default as libex above, and the service most
    # able to exploit it: the errors worth catching here are the repetitive ones,
    # a shared-memory or connection-limit failure logging a line per attempt.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # created here, joined by the seeder stack as external. the pinned name is the
  # cross-stack contract -- unpinned, compose prefixes it with the project name.
  libex-db:
    name: libex-db
    driver: bridge
