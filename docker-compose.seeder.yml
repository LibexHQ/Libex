# The seeder, as a Portainer stack of its own -- a separate Compose project,
# never combined with docker-compose.yml by `-f`. Deploy it after the API
# stack: both run `alembic upgrade head` on start and nothing orders them
# across stacks.
#
# Required in this stack's environment, no defaults: DB_HOST (the Docker host
# address the API stack publishes postgres on), DB_PASSWORD, SEEDER_PROXY_URL.

# pinned so this file gets its own project, not `libex` shared with docker-compose.yml.
name: libex-seeder

services:
  libex-seeder:
    # the API's image: scripts/seed.py imports app/services/seeder.py.
    image: ghcr.io/libexhq/libex:latest
    container_name: libex-seeder
    # the forever loop, not --once: unless-stopped would restart --once's clean
    # exit immediately, running cycles with none of SEEDER_INTERVAL_HOURS' pacing.
    command: ["python", "-m", "scripts.seed"]
    restart: unless-stopped
    environment:
      # a separate project, so the API stack's `postgres` alias does not resolve
      # here. 5432 is a literal because the publishing side is one.
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-libex}:${DB_PASSWORD:?set DB_PASSWORD in this stack's environment -- the same value the API stack uses}@${DB_HOST:?set DB_HOST to the Docker host address where the API stack publishes postgres on 5432}:5432/${DB_NAME:-libex}
      # AUDIBLE_PROXY_URL is the name the client reads; the host-side name is
      # SEEDER_PROXY_URL so a pasted API stack environment cannot send seeder
      # traffic out by the exit the public API answers on.
      - AUDIBLE_PROXY_URL=${SEEDER_PROXY_URL:?set SEEDER_PROXY_URL to this stack's own VPN exit -- its hostname must contain "seeder" or scripts/seed.py refuses to start}
      # one cache table, shared with the API, so one TTL. match the API stack.
      - CACHE_TTL=${CACHE_TTL:-86400}
      # the defaults below repeat app/core/config.py: unset interpolates to an
      # empty string that overrides the compiled default rather than falling
      # back to it, and a blank SEEDER_REGIONS walks no regions at all.
      - SEEDER_INTERVAL_HOURS=${SEEDER_INTERVAL_HOURS:-24}
      - SEEDER_REQUEST_DELAY=${SEEDER_REQUEST_DELAY:-1.0}
      - SEEDER_REGIONS=${SEEDER_REGIONS:-us}
      - SEEDER_NEW_RELEASES_INTERVAL_HOURS=${SEEDER_NEW_RELEASES_INTERVAL_HOURS:-24}
      - SEEDER_REFRESH_ENABLED=${SEEDER_REFRESH_ENABLED:-false}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AXIOM_TOKEN=${AXIOM_TOKEN:-}
      - AXIOM_DATASET=${AXIOM_DATASET:-libex}
      # no WEB_CONCURRENCY, SEED_SECRET, MIGRATION_* or PORT: this serves nothing.
    # ten seconds above scripts/seed.py's 300s DRAIN_TIMEOUT_SECONDS, which it
    # spends letting queued writes land; the default 10s grace SIGKILLs mid-drain.
    stop_grace_period: 310s
    # unmeasured guard, interpolated so an OOM loop is fixable without a rebuild.
    mem_limit: ${SEEDER_MEM_LIMIT:-1g}
    networks:
      - libex-proxy

networks:
  # created by the API stack; this one joins it and never creates or removes it.
  libex-proxy:
    name: libex-proxy
    external: true
