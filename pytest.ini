[pytest]
asyncio_mode = auto
markers =
    integration: marks tests that require a real database via testcontainers (requires Docker)

# Every test in this suite finishes in well under a second -- the slowest
# measured 0.69s (unit) and 0.61s (integration) -- so 30s is not a budget any
# honest test approaches, it is a tripwire for one that has stopped
# terminating. It exists because a non-terminating test is not a hang you
# read a traceback from: unittest.mock records every call it receives, so a
# loop calling a mock allocates without bound and takes the host down before
# anyone sees a failure. Measured at ~320MB/s, which is what sets the value --
# 30s caps a runaway near 10GB and leaves the machine alive to report it,
# where the default of no timeout at all cost four WSL freezes.
#
# signal (SIGALRM) rather than thread: it raises inside the offending test
# between bytecodes, so the loop is interrupted, the traceback names the test,
# and the rest of the run still executes. The thread method would kill the
# whole process and report nothing about the other 1093 tests.
timeout = 30
timeout_method = signal
