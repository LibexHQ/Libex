name: Tests
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.lock
            requirements-tooling.lock
      # The dev lock, not the application one: the test runners live there now,
      # so that they are not in requirements.lock and therefore not in the
      # published image. The dev lock is a strict superset of the application
      # lock, so this job still runs against every version that ships.
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.lock
      # Into a venv of its own, never the job's environment. pip-audit's
      # dependency tree overlaps the application's -- requests, urllib3,
      # packaging, certifi -- so installing it alongside would let pip move
      # packages that were just installed under hash verification, and the
      # audit would then be reading an environment that no longer matches
      # either lock. RUNNER_TEMP keeps it out of the workspace, so it can never
      # reach a build context or a commit.
      - name: Install tooling
        run: |
          python -m venv "$RUNNER_TEMP/tooling"
          "$RUNNER_TEMP/tooling/bin/pip" install --require-hashes -r requirements-tooling.lock
      # One invocation over all five, unlike the audit step below: ruff
      # reports every finding across every path it is given, so splitting it
      # per directory would gain nothing and lose something -- the block runs
      # under `bash -e`, so the first failing directory would abort the rest
      # and hide whatever is behind it. The list is exhaustive rather than
      # selective; these five hold every Python file in the repo.
      - name: Lint with ruff
        run: |
          "$RUNNER_TEMP/tooling/bin/ruff" check app/ libex_core/ migrations/ scripts/ tests/ --ignore E501
      # Audits the locks by name rather than whatever happens to be installed,
      # so what is checked is exactly what ships. Both are named: the first is
      # the shipped set, and the second adds the test-only packages, which
      # never reach production but do run in CI with access to the repo's
      # secrets. The third audits the audit tooling itself: leaving the tool
      # that reports vulnerabilities as the one thing nothing checks is a gap
      # this slice exists to close.
      #
      # Each lock is audited on its own, never three -r flags on one command:
      # pip-audit resolves everything it is handed as a single install, and
      # these three sets are deliberately unsatisfiable together -- the
      # application locks are held to constraints.txt while the tooling lock
      # resolves freely. Combining them fails with a pip install error rather
      # than reporting anything.
      #
      # The step blocks only on advisories this change introduces, compared
      # by advisory id against a base. An advisory that is already on the base
      # is printed but does not fail the job: it was published against
      # something that already shipped, and it gets fixed through a normal
      # dependency update, not by turning every unrelated change red until a
      # fix clears the cooldown. The base is the PR's target for a pull
      # request, and dev for a push to any other branch. A push to dev or
      # main compares against what the branch held before the push, so a
      # merge that brings an advisory in is still caught there. A pip-audit
      # crash, a skipped package or a base that cannot be fetched fails the
      # step. The rules themselves live in scripts/audit-new-advisories.sh.
      - name: Audit dependencies
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF"
            base=$(git rev-parse FETCH_HEAD)
          elif [ "$GITHUB_REF" = refs/heads/dev ] || [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
              git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
              base=$(git rev-parse HEAD^1)
            else
              git fetch --no-tags --depth=1 origin "$BEFORE"
              base="$BEFORE"
            fi
          else
            git fetch --no-tags --depth=1 origin refs/heads/dev
            base=$(git rev-parse FETCH_HEAD)
          fi
          PATH="$RUNNER_TEMP/tooling/bin:$PATH" LIBEX_AUDIT_BASE="$base" \
            scripts/audit-new-advisories.sh requirements.lock requirements-dev.lock requirements-tooling.lock
      # --ignore as well as -m: the dev lock carries testcontainers, and
      # tests/integration/conftest.py starts its container at MODULE IMPORT
      # rather than in a fixture, so deselecting by marker still pays for a
      # real postgres:16 and the full migration chain during collection --
      # for zero selected tests. Ignoring the directory keeps collection out
      # of it entirely. Every file under tests/integration/ is fully
      # integration-marked, so this selects exactly what the marker did.
      - name: Run unit tests
        run: pytest tests/ -v -m "not integration" --ignore=tests/integration
      # Built from the tooling venv with --no-isolation, never an isolated
      # build: isolation would fetch flit_core from the index with no hash
      # check, so the backend that writes the wheel would be the one thing in
      # the build nobody verified.
      - name: Build libex-core
        run: |
          "$RUNNER_TEMP/tooling/bin/python" -m build --no-isolation --outdir "$RUNNER_TEMP/libex-core-dist" .
      # The packaging tests skip themselves when build or flit_core is missing,
      # and the job's environment deliberately has neither, so the unit test
      # step above skips them. Here they run with exactly those two (plus
      # pyproject_hooks, which build needs) borrowed from the tooling venv by
      # symlink -- installing them into the job's environment would mean a
      # second, unhashed copy, and putting the whole tooling site-packages on
      # the path would shadow the application's pinned requests and idna with
      # the tooling lock's. The import check comes first because a skip would
      # otherwise pass this step green without testing anything.
      - name: Check libex-core packaging
        run: |
          tools="$RUNNER_TEMP/build-tools"
          site="$("$RUNNER_TEMP/tooling/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          mkdir "$tools"
          for entry in build build-*.dist-info flit_core flit_core-*.dist-info pyproject_hooks pyproject_hooks-*.dist-info; do
            for path in "$site"/$entry; do
              test -e "$path"
              ln -s "$path" "$tools/"
            done
          done
          PYTHONPATH="$tools" python -c 'import build, flit_core'
          PYTHONPATH="$tools" pytest tests/libex_core/test_packaging.py tests/libex_core/test_installed_cli.py -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.lock
      - name: Run integration tests
        run: pytest tests/ -v -m integration
