[build-system]
requires = ["flit_core>=4.1,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "libex-core"
dynamic = ["version", "description"]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.13.4,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
storage = [
    "sqlalchemy>=2.0.46,<2.1",
    "alembic>=1.18.4,<1.19",
    "aiosqlite>=0.22.1,<0.23",
]
postgres = [
    "libex-core[storage]",
    "asyncpg>=0.31,<0.32",
]

[project.scripts]
libex-core = "libex_core.cli.main:main"

[project.urls]
Homepage = "https://github.com/LibexHQ/Libex"
Source = "https://github.com/LibexHQ/Libex"
Issues = "https://github.com/LibexHQ/Libex/issues"
Changelog = "https://github.com/LibexHQ/Libex/blob/main/libex_core/CHANGELOG.md"

[tool.flit.module]
name = "libex_core"

# Generated by `python -m libex_core.cli._render --write libex-core-data`;
# the man page and completions install under the environment prefix.
[tool.flit.external-data]
directory = "libex-core-data"

[tool.flit.sdist]
exclude = ["**/__pycache__", "**/*.pyc"]
