name: Publish Docker Image

# One publish at a time, and never cancel one that is running: a half-pushed
# image is worse than a late one. The tip-of-main check below needs this, or
# two runs could each see themselves as the tip and race to push `latest`.
# `queue: max` keeps every waiting run instead of only the newest. With the
# default, a third run arriving would cancel the one already waiting, and if
# that one was the tip of main its sha tag never ships and `latest` stays
# behind until the next merge.
concurrency:
  group: publish-main
  cancel-in-progress: false
  queue: max

on:
  workflow_run:
    workflows: ["Tests"]
    branches: [main]
    types: [completed]

jobs:
  build-and-push:
    # `branches: [main]` above matches the head branch NAME only, and Tests
    # also runs on pull_request, so a fork PR from its own branch called main
    # would get here too. Only a push to this repository's main may publish.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tests runs can finish out of order, so a commit can reach this job after
      # a newer one has already published. Moving `latest` back to it would
      # roll the API back onto a schema the newer image already migrated past,
      # and its startup `alembic upgrade head` cannot find that revision.
      # Only the current tip of main gets `latest`; every commit gets its sha.
      # GITHUB_SHA on workflow_run is the tip of main, not the commit tested,
      # so the sha tag and revision label come from head_sha instead.
      - name: Check whether this commit is still the tip of main
        id: tip
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$tip" ]; then
            echo "Could not read the tip of main" >&2
            exit 1
          fi
          echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $tip, publishing $HEAD_SHA without latest"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ghcr.io/libexhq/libex
            sunbrolynk/libex
          tags: |
            type=raw,value=latest,enable=${{ steps.tip.outputs.latest == 'true' }}
            type=raw,value=sha-${{ steps.tip.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
