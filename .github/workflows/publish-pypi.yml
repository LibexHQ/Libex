name: Publish libex-core to PyPI

# Tag pushes only, and only tags of this shape. Never pull_request,
# pull_request_target or workflow_run: each of those can be set off by code
# that has not been merged, and this workflow ends holding a token that can
# publish to PyPI.
on:
  push:
    tags: ['libex-core-v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No pip cache: a cache is shared state another workflow run can write,
      # and nothing restored from it would be hash-checked again here.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      # The packaging tests run under the repo's conftest, which imports the
      # application, so the job needs the dev lock as well as the tooling one.
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.lock
      - name: Install tooling
        run: |
          python -m venv "$RUNNER_TEMP/tooling"
          "$RUNNER_TEMP/tooling/bin/pip" install --require-hashes -r requirements-tooling.lock
      # A tag that names one version over code that declares another would
      # publish the code's version under a release nobody meant to cut.
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared="$(python -c 'import libex_core; print(libex_core.__version__)')"
          if [ "$TAG" != "libex-core-v$declared" ]; then
            echo "::error::tag $TAG does not match libex_core.__version__ $declared"
            exit 1
          fi
      # --no-isolation from the hashed tooling venv, never an isolated build:
      # isolation would fetch flit_core from the index unverified.
      - name: Build
        run: |
          "$RUNNER_TEMP/tooling/bin/python" -m build --no-isolation --outdir dist/ .
      # Same borrowing as the Tests workflow, for the same reasons: build and
      # flit_core come from the hashed tooling venv by symlink, and the import
      # check stops a silent skip from passing the step.
      - name: Check packaging
        run: |
          tools="$RUNNER_TEMP/build-tools"
          site="$("$RUNNER_TEMP/tooling/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          mkdir "$tools"
          for entry in build build-*.dist-info flit_core flit_core-*.dist-info pyproject_hooks pyproject_hooks-*.dist-info; do
            for path in "$site"/$entry; do
              test -e "$path"
              ln -s "$path" "$tools/"
            done
          done
          PYTHONPATH="$tools" python -c 'import build, flit_core'
          PYTHONPATH="$tools" pytest tests/libex_core/test_packaging.py tests/libex_core/test_installed_cli.py -v
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: libex-core-dist
          path: dist/
          if-no-files-found: error

  # Publishes exactly what the build job uploaded, without rebuilding, and is
  # the only job holding id-token. The pypi environment is where the human
  # approval sits, so nothing reaches PyPI until someone has looked at it.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/libex-core/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: libex-core-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
